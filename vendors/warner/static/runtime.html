<!doctype html>
<html><head><meta charset="utf-8"><title>Warner bridge runtime</title>
<style>html,body{margin:0;background:#000}canvas{width:640px;height:360px}</style>
<script src="/sdk/mqtt/mqtt.min.js"></script>
<script src="/sdk/mqtt/mqtt.js"></script>
<script src="/sdk/mqtt/mqttAction.js"></script>
<script src="/sdk/decoder_def.js"></script>
<script src="/sdk/hevcdec.js"></script>
<script src="/sdk/glutils.js"></script>
<script src="/sdk/js/md5.js"></script>
<script src="/sdk/js/md5fun.js"></script>
<script src="/sdk/js/uuid.js"></script>
<script src="/sdk/js/livekit-client.umd.js"></script>
<script defer src="/sdk/connector.js"></script>
</head><body><canvas id="canvas1" width="2304" height="1296"></canvas>
<script>
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('failed to load '+src));document.body.appendChild(s)})}
window.addEventListener('load',async()=>{
  try{
    let hard=false;
    if(typeof VideoDecoder!=='undefined'){
      const r=await VideoDecoder.isConfigSupported({codec:'hev1.1.6.L120.90',codedWidth:1080,codedHeight:720});hard=!!r.supported;
    }
    // Emscripten otherwise derives the WASM URL from document.currentScript.
    // Dynamic loading can leave that pointing at /runtime, producing a valid
    // LiveKit track backed by a blank canvas when jadecoder.wasm returns 404.
    window.Module=window.Module||{};
    window.Module.locateFile=(path)=>'/sdk/'+path.replace(/^.*\//,'');
    await loadScript(hard?'/sdk/nalu2mp4.js':'/sdk/jadecoder.js');
    await loadScript('/sdk/play.js');
    await loadScript('/static/runtime.js');
  }catch(error){document.body.dataset.error=error.message;console.error(error)}
});
</script></body></html>
